<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swalleh Empire - Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #2563eb;
    }
  </style>
</head>

<body>

  <header>
    <h1>Swalleh Empire</h1>
    <p>Admin Product Manager</p>
  </header>

  <div class="container">

    <h2>Add New Product</h2>

    <form id="productForm">

      <label>Product Name</label>
      <input
        type="text"
        id="name"
        placeholder="Example: Fujitsu Core i3 8th Gen"
        required
      >

      <label>Price (KSh)</label>
      <input
        type="number"
        id="price"
        placeholder="Example: 15000"
        required
      >

      <label>Category</label>
      <select id="category" required>
        <option value="">Select category</option>
        <option value="phones">Phones</option>
        <option value="chargers">Chargers</option>
        <option value="power banks">Power Banks</option>
        <option value="screen protectors">Screen Protectors</option>
        <option value="audio">Audio System & Headphones</option>
        <option value="smart watches">Smart Watches</option>
        <option value="television">Television</option>
        <option value="laptops">Laptops</option>
        <option value="house appliances">House Appliances</option>
        <option value="subwoofers">Subwoofers</option>
        <option value="bluetooth speakers">Bluetooth Speakers</option>
        <option value="neckband">Neckband</option>
        <option value="phone cases">Phone Cases</option>
        <option value="shavers">Shavers</option>
        <option value="usb cables">USB Cables</option>
        <option value="earphones">Earphones</option>
        <option value="wall bracket">Wall Bracket</option>
        <option value="ironboxes">Iron Boxes</option>
        <option value="charger controller">Charger Controller</option>
        <option value="earpods">Earpods</option>
        <option value="earbuds">Earbuds</option>
        <option value="decoders">Decoders</option>
        <option value="headphones">Headphones</option>
        <option value="batteries">Batteries</option>
        <option value="gaming accessories">Gaming Accessories</option>
        <option value="solars">Solars</option>
        <option value="tablets">Tablets</option>
      </select>

      <label>Description</label>
      <textarea
        id="description"
        placeholder="Enter product description..."
        required
      ></textarea>

      <label>Product Image</label>
      <input
        type="file"
        id="image"
        accept="image/*"
        required
      >

      <button type="submit">
        Add Product
      </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Back to Swalleh Empire
    </a>

  </div>


  <script>

    // ==========================================
    // YOUR SUPABASE DETAILS
    // ==========================================

    const SUPABASE_URL = "https://rbgqqtayaexgyhozufpg.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_FC5-3_O-bJ6oQKt3SESRlg_TUeT70cl";


    // Connect to Supabase

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // ==========================================
    // ADD PRODUCT
    // ==========================================

    document
      .getElementById("productForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const message =
          document.getElementById("message");

        message.textContent = "Adding product...";


        const name =
          document.getElementById("name").value.trim();

        const price =
          document.getElementById("price").value;

        const category =
          document.getElementById("category").value;

        const description =
          document.getElementById("description").value.trim();

        const imageFile =
          document.getElementById("image").files[0];


        if (!imageFile) {
          message.textContent =
            "Please select an image.";

          return;
        }


        try {

          // Create unique image name

          const extension =
            imageFile.name.split(".").pop();

          const fileName =
            Date.now() +
            "-" +
            Math.random()
              .toString(36)
              .substring(2) +
            "." +
            extension;


          // ==========================================
          // UPLOAD IMAGE
          // ==========================================

          const { error: uploadError } =
            await supabase.storage
              .from("product-images")
              .upload(
                fileName,
                imageFile
              );


          if (uploadError) {
            throw uploadError;
          }


          // ==========================================
          // GET IMAGE URL
          // ==========================================

          const { data: publicUrlData } =
            supabase.storage
              .from("product-images")
              .getPublicUrl(fileName);


          const imageUrl =
            publicUrlData.publicUrl;


          // ==========================================
          // SAVE PRODUCT
          // ==========================================

          const { error: insertError } =
            await supabase
              .from("products")
              .insert([
                {
                  name: name,
                  price: Number(price),
                  image: imageUrl,
                  description: description,
                  category: category
                }
              ]);


          if (insertError) {
            throw insertError;
          }


          // Success

          message.textContent =
            "✅ Product added successfully!";


          // Clear form

          document
            .getElementById("productForm")
            .reset();

        }

        catch (error) {

          console.error(error);

          message.textContent =
            "❌ Error: " + error.message;

        }

      });

  </script>

</body>
</html>
