
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swalleh Empire - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 5px;
    }

    header p {
      margin: 0;
      color: #d1d5db;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 30px auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .delete-btn {
      background: #dc2626;
    }

    .delete-btn:hover {
      background: #b91c1c;
    }

    .edit-btn {
      background: #2563eb;
    }

    .edit-btn:hover {
      background: #1d4ed8;
    }

    .cancel-btn {
      background: #6b7280;
    }

    .refresh-btn {
      background: #2563eb;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      border-radius: 7px;
      display: none;
      white-space: pre-wrap;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block !important;
      background: #dbeafe;
      color: #1e40af;
    }

    .preview {
      margin-top: 15px;
      text-align: center;
    }

    .preview img {
      max-width: 200px;
      max-height: 200px;
      border-radius: 8px;
      display: none;
      margin: auto;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .product-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 8px;
      background: #f3f4f6;
    }

    .product-card h3 {
      margin-bottom: 5px;
    }

    .price {
      font-weight: bold;
      color: #16a34a;
      font-size: 18px;
    }

    .category {
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }

    .product-card button {
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .back {
      display: block;
      text-align: center;
      margin: 20px 0 40px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .connection-box {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .connection-ok {
      color: #166534;
    }

    .connection-error {
      color: #991b1b;
    }
  </style>
</head>

<body>

<header>
  <h1>Swalleh Empire</h1>
  <p>Admin Product Manager</p>
</header>

<div class="container">

  <!-- CONNECTION STATUS -->
  <div class="box">

    <h2>System Status</h2>

    <div id="connectionStatus" class="connection-box">
      Checking Supabase connection...
    </div>

  </div>


  <!-- ADD / UPDATE PRODUCT -->
  <div class="box">

    <h2 id="formTitle">Add New Product</h2>

    <form id="productForm">

      <label for="name">Product Name</label>

      <input
        type="text"
        id="name"
        placeholder="Example: Fujitsu Core i3 8th Gen"
        required
      >

      <label for="price">Price (KSh)</label>

      <input
        type="number"
        id="price"
        placeholder="Example: 15000"
        min="1"
        required
      >

      <label for="category">Category</label>

      <select id="category" required>

        <option value="">Select category</option>

        <option value="phones">Phones</option>
        <option value="chargers">Chargers</option>
        <option value="power banks">Power Banks</option>
        <option value="screen protectors">Screen Protectors</option>
        <option value="audio">Audio System & Headphones</option>
        <option value="smart watches">Smart Watches</option>
        <option value="television">Television</option>
        <option value="laptops">Laptops</option>
        <option value="house appliances">House Appliances</option>
        <option value="subwoofers">Subwoofers</option>
        <option value="bluetooth speakers">Bluetooth Speakers</option>
        <option value="neckband">Neckband</option>
        <option value="phone cases">Phone Cases</option>
        <option value="shavers">Shavers</option>
        <option value="usb cables">USB Cables</option>
        <option value="earphones">Earphones</option>
        <option value="wall bracket">Wall Bracket</option>
        <option value="ironboxes">Iron Boxes</option>
        <option value="charger controller">Charger Controller</option>
        <option value="earpods">Earpods</option>
        <option value="earbuds">Earbuds</option>
        <option value="decoders">Decoders</option>
        <option value="headphones">Headphones</option>
        <option value="batteries">Batteries</option>
        <option value="gaming accessories">Gaming Accessories</option>
        <option value="solars">Solars</option>
        <option value="tablets">Tablets</option>

      </select>

      <label for="description">Description</label>

      <textarea
        id="description"
        placeholder="Enter product description..."
        required
      ></textarea>

      <label for="image">Product Image</label>

      <input
        type="file"
        id="image"
        accept="image/*"
      >

      <div class="preview">
        <img id="imagePreview" alt="Image preview">
      </div>

      <button type="submit" id="submitButton">
        Add Product
      </button>

      <button
        type="button"
        id="cancelButton"
        class="cancel-btn hidden"
      >
        Cancel Update
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- PRODUCTS -->
  <div class="box">

    <h2>Existing Products</h2>

    <button
      type="button"
      id="refreshButton"
      class="refresh-btn"
    >
      Refresh Products
    </button>

    <div
      id="productsList"
      class="products"
      style="margin-top:20px;"
    ></div>

  </div>


  <a href="index.html" class="back">
    ← Back to Swalleh Empire
  </a>

</div>


<script>

  /* =====================================================
     SUPABASE CONFIGURATION
  ===================================================== */

  const SUPABASE_URL =
    "https://rbgqqtayaexgyhozufpg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_FC5-3_o-Bj6oQKt3SESRlg_TUeT70cl";

  const BUCKET_NAME =
    "product-images";


  /* =====================================================
     CREATE SUPABASE CLIENT
  ===================================================== */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const form =
    document.getElementById("productForm");

  const message =
    document.getElementById("message");

  const submitButton =
    document.getElementById("submitButton");

  const cancelButton =
    document.getElementById("cancelButton");

  const refreshButton =
    document.getElementById("refreshButton");

  const imageInput =
    document.getElementById("image");

  const imagePreview =
    document.getElementById("imagePreview");

  const productsList =
    document.getElementById("productsList");

  const formTitle =
    document.getElementById("formTitle");

  const connectionStatus =
    document.getElementById("connectionStatus");


  /* =====================================================
     STATE
  ===================================================== */

  let editingProductId = null;
  let oldImageUrl = null;


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

  }


  /* =====================================================
     ERROR TEXT
  ===================================================== */

  function getErrorMessage(error) {

    if (!error) {
      return "Unknown error.";
    }

    return (
      error.message ||
      error.details ||
      error.hint ||
      String(error)
    );

  }


  /* =====================================================
     IMAGE PREVIEW
  ===================================================== */

  imageInput.addEventListener(
    "change",
    function() {

      const file =
        imageInput.files[0];

      if (!file) {
        return;
      }

      if (!file.type.startsWith("image/")) {

        showMessage(
          "Please select an image file.",
          "error"
        );

        imageInput.value = "";

        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function(event) {

          imagePreview.src =
            event.target.result;

          imagePreview.style.display =
            "block";

        };

      reader.readAsDataURL(file);

    }
  );


  /* =====================================================
     CREATE IMAGE NAME
  ===================================================== */

  function createImageName(file) {

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    return (
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 10) +
      "." +
      extension
    );

  }


  /* =====================================================
     UPLOAD IMAGE
  ===================================================== */

  async function uploadImage(file) {

    if (!file) {
      return null;
    }

    const fileName =
      createImageName(file);

    console.log(
      "Uploading image:",
      fileName
    );

    const {
      error
    } =
      await supabaseClient
        .storage
        .from(BUCKET_NAME)
        .upload(
          fileName,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );

    if (error) {

      console.error(
        "Storage error:",
        error
      );

      throw new Error(
        "Image upload failed: " +
        getErrorMessage(error)
      );

    }

    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from(BUCKET_NAME)
        .getPublicUrl(fileName);

    if (
      !publicData ||
      !publicData.publicUrl
    ) {

      throw new Error(
        "Image uploaded, but public URL could not be created."
      );

    }

    console.log(
      "Image URL:",
      publicData.publicUrl
    );

    return publicData.publicUrl;

  }


  /* =====================================================
     TEST DATABASE CONNECTION
  ===================================================== */

  async function testConnection() {

    connectionStatus.textContent =
      "Testing connection to Supabase...";

    connectionStatus.className =
      "connection-box";

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select("id")
          .limit(1);

      if (error) {

        console.error(
          "Connection/database error:",
          error
        );

        connectionStatus.innerHTML =
          "❌ Supabase connected, but the products table could not be read.<br><br>" +
          "<strong>Error:</strong> " +
          escapeHtml(
            getErrorMessage(error)
          );

        connectionStatus.className =
          "connection-box connection-error";

        return false;

      }

      connectionStatus.innerHTML =
        "✅ Supabase connection is working.<br>" +
        "✅ The products table can be read.<br>" +
        "Products returned by test: " +
        data.length;

      connectionStatus.className =
        "connection-box connection-ok";

      return true;

    }
    catch (error) {

      console.error(
        "Connection test failed:",
        error
      );

      connectionStatus.innerHTML =
        "❌ Connection test failed.<br><br>" +
        "<strong>Error:</strong> " +
        escapeHtml(
          getErrorMessage(error)
        );

      connectionStatus.className =
        "connection-box connection-error";

      return false;

    }

  }


  /* =====================================================
     ADD / UPDATE PRODUCT
  ===================================================== */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      submitButton.disabled =
        true;

      try {

        const name =
          document
            .getElementById("name")
            .value
            .trim();

        const price =
          Number(
            document
              .getElementById("price")
              .value
          );

        const category =
          document
            .getElementById("category")
            .value;

        const description =
          document
            .getElementById("description")
            .value
            .trim();

        const imageFile =
          imageInput.files[0];


        /* VALIDATION */

        if (!name) {
          throw new Error(
            "Please enter the product name."
          );
        }

        if (!Number.isFinite(price) || price <= 0) {
          throw new Error(
            "Please enter a valid price."
          );
        }

        if (!category) {
          throw new Error(
            "Please select a category."
          );
        }

        if (!description) {
          throw new Error(
            "Please enter a description."
          );
        }


        /* =================================================
           UPDATE
        ================================================= */

        if (editingProductId !== null) {

          submitButton.textContent =
            "Updating Product...";

          showMessage(
            "Updating product...",
            "info"
          );

          let imageUrl =
            oldImageUrl;

          if (imageFile) {

            showMessage(
              "Uploading new product image...",
              "info"
            );

            imageUrl =
              await uploadImage(
                imageFile
              );

          }

          const {
            data,
            error
          } =
            await supabaseClient
              .from("products")
              .update({
                name: name,
                price: price,
                image: imageUrl,
                description: description,
                category: category
              })
              .eq(
                "id",
                editingProductId
              )
              .select();

          if (error) {

            console.error(
              "Update error:",
              error
            );

            throw new Error(
              "Product update failed: " +
              getErrorMessage(error)
            );

          }

          if (!data || data.length === 0) {

            throw new Error(
              "The update affected 0 rows. Check the products table RLS UPDATE policy."
            );

          }

          console.log(
            "Product updated:",
            data
          );

          showMessage(
            "✅ Product updated successfully!",
            "success"
          );

          resetForm();

          await loadProducts();

          return;

        }


        /* =================================================
           ADD NEW PRODUCT
        ================================================= */

        if (!imageFile) {

          throw new Error(
            "Please select a product image."
          );

        }

        submitButton.textContent =
          "Adding Product...";

        showMessage(
          "Uploading product image...",
          "info"
        );

        const imageUrl =
          await uploadImage(
            imageFile
          );

        showMessage(
          "Saving product to database...",
          "info"
        );

        const {
          data,
          error
        } =
          await supabaseClient
            .from("products")
            .insert([
              {
                name: name,
                price: price,
                image: imageUrl,
                description: description,
                category: category
              }
            ])
            .select();

        if (error) {

          console.error(
            "Insert error:",
            error
          );

          throw new Error(
            "Database insert failed: " +
            getErrorMessage(error)
          );

        }

        if (!data || data.length === 0) {

          throw new Error(
            "Product insert returned no row."
          );

        }

        console.log(
          "Product added:",
          data
        );

        showMessage(
          "✅ Product added successfully!",
          "success"
        );

        resetForm();

        await loadProducts();

      }

      catch (error) {

        console.error(
          "PRODUCT ERROR:",
          error
        );

        showMessage(
          "❌ " +
          getErrorMessage(error),
          "error"
        );

      }

      finally {

        submitButton.disabled =
          false;

        if (
          editingProductId !== null
        ) {

          submitButton.textContent =
            "Update Product";

        } else {

          submitButton.textContent =
            "Add Product";

        }

      }

    }
  );


  /* =====================================================
     LOAD PRODUCTS
  ===================================================== */

  async function loadProducts() {

    productsList.innerHTML =
      "<p>Loading products...</p>";

    console.log(
      "Loading products..."
    );

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select(
            "id,name,price,image,description,category"
          )
          .order(
            "id",
            {
              ascending: false
            }
          );

      console.log(
        "Products response:",
        {
          data: data,
          error: error
        }
      );

      if (error) {

        productsList.innerHTML =
          "<p style='color:red;'>" +
          "<strong>Could not load products.</strong><br><br>" +
          escapeHtml(
            getErrorMessage(error)
          ) +
          "</p>";

        return;

      }

      if (!data) {

        productsList.innerHTML =
          "<p style='color:red;'>" +
          "Supabase returned no data object." +
          "</p>";

        return;

      }

      if (data.length === 0) {

        productsList.innerHTML =
          "<p>No products found in the database.</p>";

        return;

      }

      productsList.innerHTML =
        "";

      data.forEach(
        function(product) {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "product-card";

          const imageHtml =
            product.image
              ?
              `
              <img
                src="${escapeHtml(product.image)}"
                alt="${escapeHtml(product.name)}"
                onerror="this.style.display='none'"
              >
              `
              :
              `
              <div
                style="
                  height:180px;
                  background:#f3f4f6;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  border-radius:8px;
                  color:#666;
                "
              >
                No image
              </div>
              `;

          card.innerHTML = `

            ${imageHtml}

            <h3>
              ${escapeHtml(product.name)}
            </h3>

            <div class="price">
              KSh ${Number(product.price).toLocaleString()}
            </div>

            <div class="category">
              ${escapeHtml(product.category || "")}
            </div>

            <p>
              ${escapeHtml(product.description || "")}
            </p>

            <button
              class="edit-btn"
              onclick="editProduct('${escapeHtml(String(product.id))}')"
            >
              Edit Product
            </button>

            <button
              class="delete-btn"
              onclick="deleteProduct('${escapeHtml(String(product.id))}')"
            >
              Delete Product
            </button>

          `;

          productsList.appendChild(
            card
          );

        }
      );

    }

    catch (error) {

      console.error(
        "LOAD PRODUCTS ERROR:",
        error
      );

      productsList.innerHTML =
        "<p style='color:red;'>" +
        "<strong>Unexpected error:</strong><br><br>" +
        escapeHtml(
          getErrorMessage(error)
        ) +
        "</p>";

    }

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================================
     EDIT PRODUCT
  ===================================================== */

  window.editProduct =
    async function(productId) {

      showMessage(
        "Loading product...",
        "info"
      );

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("products")
            .select(
              "id,name,price,image,description,category"
            )
            .eq(
              "id",
              productId
            )
            .single();

        if (error) {

          throw new Error(
            "Could not load product: " +
            getErrorMessage(error)
          );

        }

        if (!data) {

          throw new Error(
            "Product was not found."
          );

        }

        editingProductId =
          data.id;

        oldImageUrl =
          data.image || null;

        document
          .getElementById("name")
          .value =
          data.name || "";

        document
          .getElementById("price")
          .value =
          data.price || "";

        document
          .getElementById("category")
          .value =
          data.category || "";

        document
          .getElementById("description")
          .value =
          data.description || "";

        imageInput.value =
          "";

        if (data.image) {

          imagePreview.src =
            data.image;

          imagePreview.style.display =
            "block";

        }
        else {

          imagePreview.src =
            "";

          imagePreview.style.display =
            "none";

        }

        formTitle.textContent =
          "Update Product";

        submitButton.textContent =
          "Update Product";

        cancelButton.classList.remove(
          "hidden"
        );

        showMessage(
          "You are now editing this product.",
          "info"
        );

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }

      catch (error) {

        console.error(
          "EDIT ERROR:",
          error
        );

        showMessage(
          "❌ " +
          getErrorMessage(error),
          "error"
        );

      }

    };


  /* =====================================================
     DELETE PRODUCT
  ===================================================== */

  window.deleteProduct =
    async function(productId) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this product?"
        );

      if (!confirmed) {
        return;
      }

      showMessage(
        "Deleting product...",
        "info"
      );

      try {

        const {
          error
        } =
          await supabaseClient
            .from("products")
            .delete()
            .eq(
              "id",
              productId
            );

        if (error) {

          throw new Error(
            "Delete failed: " +
            getErrorMessage(error)
          );

        }

        showMessage(
          "✅ Product deleted successfully!",
          "success"
        );

        await loadProducts();

      }

      catch (error) {

        console.error(
          "DELETE ERROR:",
          error
        );

        showMessage(
          "❌ " +
          getErrorMessage(error),
          "error"
        );

      }

    };


  /* =====================================================
     CANCEL UPDATE
  ===================================================== */

  cancelButton.addEventListener(
    "click",
    function() {

      resetForm();

      showMessage(
        "Update cancelled.",
        "info"
      );

    }
  );


  /* =====================================================
     RESET FORM
  ===================================================== */

  function resetForm() {

    form.reset();

    editingProductId =
      null;

    oldImageUrl =
      null;

    imagePreview.src =
      "";

    imagePreview.style.display =
      "none";

    formTitle.textContent =
      "Add New Product";

    submitButton.textContent =
      "Add Product";

    cancelButton.classList.add(
      "hidden"
    );

  }


  /* =====================================================
     REFRESH
